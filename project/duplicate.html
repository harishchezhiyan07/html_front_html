<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body>
<button
  id="loginBtn"
  onclick="loginUser()"
  class="bg-yellow-400 hover:bg-yellow-500 text-black px-6 py-2 rounded-full font-bold">
  Login
</button>
<button
  onclick="bookService()"
  class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
  Book Now
</button>
<div
  id="loginModal"
  class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">

  <div class="bg-white p-8 rounded-lg w-96">

    <h2 class="text-2xl font-bold mb-5">
      Login
    </h2>

    <input
      type="text"
      id="username"
      placeholder="Enter Name"
      class="w-full border p-2 rounded mb-4">

    <input
      type="password"
      id="password"
      placeholder="Password"
      class="w-full border p-2 rounded mb-4">

    <button
      onclick="submitLogin()"
      class="w-full bg-blue-600 text-white py-2 rounded">
      Login
    </button>

  </div>

</div>
<div
  id="bookingModal"
  class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">

  <div class="bg-white p-8 rounded-lg w-[450px]">

    <h2 class="text-2xl font-bold mb-5">
      Book Laundry
    </h2>

    <input
      id="customer"
      type="text"
      placeholder="Customer Name"
      class="w-full border p-2 rounded mb-3">

    <input
      id="phone"
      type="number"
      placeholder="Phone Number"
      class="w-full border p-2 rounded mb-3">

    <select
      id="service"
      class="w-full border p-2 rounded mb-3">

      <option>Dry Cleaning</option>
      <option>Wash & Fold</option>
      <option>Ironing</option>

    </select>

    <input
      id="quantity"
      type="number"
      placeholder="Quantity (Kg)"
      class="w-full border p-2 rounded mb-3">

    <button
      onclick="confirmBooking()"
      class="w-full bg-green-600 text-white py-2 rounded">
      Confirm Booking
    </button>

  </div>

</div>
<button
  id="loginBtn"
  onclick="loginUser()"
  class="bg-yellow-400 hover:bg-yellow-500 text-black px-6 py-2 rounded-full font-bold">
  Login
</button>

<p id="message" class="mt-4 text-green-600 font-semibold"></p>
<body class="bg-blue-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-96">
    
    <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
      Login
    </h1>

    <!-- Email -->
    <input
      type="email"
      id="email"
      placeholder="Enter Email"
      class="w-full border border-gray-300 p-3 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
    >

    <!-- Password -->
    <input
      type="password"
      id="password"
      placeholder="Enter Password"
      class="w-full border border-gray-300 p-3 rounded-lg mb-6 focus:outline-none focus:ring-2 focus:ring-blue-500"
    >

    <!-- Button -->
    <button
      onclick="loginUser()"
      class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
    >
      Login
    </button>

    <p id="message" class="text-center mt-4 font-semibold"></p>
  </div>
<script src="duplicate.js"></script>
</body>
</html>
